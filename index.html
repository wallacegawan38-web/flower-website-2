<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>For You 🌸</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 50% 45%,
            #123d4b 0%,
            #071b25 40%,
            #02080d 80%
        );
}


/* =====================================================
   START SCREEN
===================================================== */

.start-screen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    background:
        radial-gradient(
            circle,
            #123844,
            #02080d
        );

    transition:
        opacity 1.5s ease;
}

.start-screen.hide {

    opacity: 0;

    pointer-events: none;
}


.start-title {

    color: white;

    font-size: 28px;

    letter-spacing: 3px;

    text-align: center;

    margin-bottom: 25px;

    text-shadow:

        0 0 8px white,

        0 0 20px #8fffff,

        0 0 40px #45e5ff;
}


.start-button {

    padding:
        14px 30px;

    border-radius: 30px;

    border:
        1px solid
        rgba(
            190,
            255,
            255,
            .7
        );

    background:
        rgba(
            100,
            230,
            240,
            .08
        );

    color: white;

    font-size: 16px;

    cursor: pointer;

    box-shadow:

        0 0 15px
        rgba(
            100,
            240,
            255,
            .5
        ),

        inset 0 0 10px
        rgba(
            100,
            240,
            255,
            .1
        );

    transition: .3s;
}


.start-button:hover {

    transform:
        scale(1.08);

    box-shadow:

        0 0 30px
        rgba(
            100,
            240,
            255,
            .9
        );
}


/* =====================================================
   MAIN SCENE
===================================================== */

.scene {

    position: relative;

    width: 100%;

    height: 100vh;

    overflow: hidden;
}


/* =====================================================
   STARS
===================================================== */

.stars {

    position: absolute;

    inset: 0;
}


.star {

    position: absolute;

    width: 2px;

    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 5px white,

        0 0 12px #78ffff;

    animation:

        starTwinkle
        3s
        infinite
        ease-in-out;
}


/* =====================================================
   GROUND GLOW
===================================================== */

.ground-glow {

    position: absolute;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 80%;

    height: 150px;

    background:
        radial-gradient(
            ellipse,
            rgba(
                40,
                230,
                220,
                .25
            ),
            transparent 70%
        );

    filter:
        blur(20px);
}


/* =====================================================
   GARDEN
===================================================== */

.garden {

    position: absolute;

    bottom: 45px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 520px;

    max-width: 100vw;

    height: 580px;
}


/* =====================================================
   STEMS
===================================================== */

.stem {

    position: absolute;

    bottom: 0;

    width: 5px;

    height: 0;

    border-radius: 10px;

    background:
        linear-gradient(
            to right,
            #07513e,
            #4bd8a9,
            #07513e
        );

    box-shadow:

        0 0 8px
        rgba(
            80,
            255,
            210,
            .5
        );

    transform-origin:
        bottom;

    animation:

        stemGrow
        4s
        cubic-bezier(
            .2,
            .8,
            .2,
            1
        )
        forwards;
}


.stem.center {

    left: 258px;

    animation-delay:
        .5s;
}


.stem.left1 {

    left: 195px;

    animation-delay:
        2.5s;
}


.stem.left2 {

    left: 145px;

    animation-delay:
        3.7s;
}


.stem.right1 {

    left: 320px;

    animation-delay:
        3s;
}


.stem.right2 {

    left: 370px;

    animation-delay:
        4s;
}


/* =====================================================
   LEAVES
===================================================== */

.leaf {

    position: absolute;

    width: 105px;

    height: 32px;

    border-radius:
        100% 0 100% 0;

    background:
        linear-gradient(
            90deg,
            #075b4c,
            #24c4a1,
            #75f2d0
        );

    opacity: 0;

    transform-origin:
        left center;

    box-shadow:

        0 0 10px
        rgba(
            60,
            255,
            220,
            .5
        );

    animation:

        leafGrow
        2s
        ease
        forwards;
}


.leaf.l1 {

    left: 165px;

    bottom: 180px;

    transform:
        rotate(-35deg)
        scale(0);

    animation-delay:
        4s;
}


.leaf.l2 {

    left: 195px;

    bottom: 260px;

    transform:
        rotate(25deg)
        scale(0);

    animation-delay:
        4.7s;
}


.leaf.l3 {

    left: 285px;

    bottom: 210px;

    transform:
        rotate(35deg)
        scale(0);

    animation-delay:
        5s;
}


.leaf.l4 {

    left: 310px;

    bottom: 300px;

    transform:
        rotate(-25deg)
        scale(0);

    animation-delay:
        5.5s;
}


/* =====================================================
   FLOWERS
===================================================== */

.flower {

    position: absolute;

    width: 75px;

    height: 75px;

    transform:
        scale(0);

    animation:

        flowerBloom
        2s
        cubic-bezier(
            .2,
            .8,
            .2,
            1
        )
        forwards;
}


.flower.f1 {

    left: 222px;

    top: 70px;

    animation-delay:
        4.8s;
}


.flower.f2 {

    left: 160px;

    top: 160px;

    animation-delay:
        6.2s;
}


.flower.f3 {

    left: 105px;

    top: 230px;

    animation-delay:
        7.2s;
}


.flower.f4 {

    left: 290px;

    top: 155px;

    animation-delay:
        6.7s;
}


.flower.f5 {

    left: 345px;

    top: 225px;

    animation-delay:
        7.7s;
}


/* =====================================================
   PETALS
===================================================== */

.petal {

    position: absolute;

    left: 22px;

    top: 10px;

    width: 32px;

    height: 45px;

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse,
            #ffffff,
            #d8ffff 40%,
            #71cfd3 90%
        );

    box-shadow:

        0 0 10px white,

        0 0 25px #9cffff,

        0 0 45px
        rgba(
            80,
            240,
            255,
            .6
        );

    transform-origin:
        50% 100%;
}


.p1 {
    transform:
        rotate(0deg)
        translateY(-14px);
}

.p2 {
    transform:
        rotate(72deg)
        translateY(-14px);
}

.p3 {
    transform:
        rotate(144deg)
        translateY(-14px);
}

.p4 {
    transform:
        rotate(216deg)
        translateY(-14px);
}

.p5 {
    transform:
        rotate(288deg)
        translateY(-14px);
}


/* =====================================================
   FLOWER CENTER
===================================================== */

.flower-center {

    position: absolute;

    left: 27px;

    top: 27px;

    width: 22px;

    height: 22px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            white,
            #a5ffff,
            #39b9bd
        );

    box-shadow:

        0 0 10px white,

        0 0 25px #8fffff,

        0 0 40px #42e8ed;

    z-index: 5;
}


/* =====================================================
   LEFT AND RIGHT TEXT
===================================================== */

.love-text {

    position: absolute;

    width: 190px;

    color: white;

    font-size: 17px;

    line-height: 1.6;

    text-align: center;

    letter-spacing: 1px;

    opacity: 0;

    z-index: 20;

    text-shadow:

        0 0 5px white,

        0 0 12px #aaffff,

        0 0 25px #4fffff,

        0 0 45px #24dce8;

    animation:

        textGlow
        2s
        ease
        forwards;
}


.left-text {

    left: -55px;

    top: 260px;

    animation-delay:
        8s;
}


.right-text {

    right: -55px;

    top: 260px;

    animation-delay:
        8.5s;
}


/* =====================================================
   CENTER TEXT
===================================================== */

.center-text {

    position: absolute;

    width: 100%;

    top: 35px;

    text-align: center;

    color: white;

    font-size: 22px;

    letter-spacing: 3px;

    opacity: 0;

    z-index: 30;

    text-shadow:

        0 0 8px white,

        0 0 18px #aaffff,

        0 0 40px #50eaff;

    animation:

        centerText
        2s
        ease
        10s
        forwards;
}


/* =====================================================
   PARTICLES
===================================================== */

.text-particles {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 15;
}


.text-particle {

    position: absolute;

    width: 4px;

    height: 4px;

    border-radius: 50%;

    background: #dfffff;

    box-shadow:

        0 0 7px white,

        0 0 16px #6fffff,

        0 0 28px #42e8ff;

    opacity: 0;

    animation:

        textParticle
        3s
        infinite
        ease-out;
}


/* =====================================================
   GROUND
===================================================== */

.ground {

    position: absolute;

    bottom: -35px;

    left: -10%;

    width: 120%;

    height: 110px;

    border-radius:
        50% 50% 0 0;

    background:

        radial-gradient(
            ellipse,
            #073b37,
            #031b18 60%,
            #010807
        );
}


/* =====================================================
   GRASS
===================================================== */

.grass {

    position: absolute;

    bottom: 0;

    width: 100%;

    height: 150px;
}


.blade {

    position: absolute;

    bottom: 0;

    width: 4px;

    height: 0;

    border-radius:
        100% 100% 0 0;

    background:

        linear-gradient(
            to top,
            #064a39,
            #38c69b
        );

    transform-origin:
        bottom;

    animation:

        grassGrow
        2.5s
        ease
        forwards;
}


/* =====================================================
   MUSIC BUTTON
===================================================== */

.music-button {

    position: fixed;

    right: 20px;

    bottom: 20px;

    z-index: 50;

    width: 45px;

    height: 45px;

    border-radius: 50%;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .5
        );

    background:
        rgba(
            255,
            255,
            255,
            .08
        );

    color: white;

    cursor: pointer;

    opacity: 0;

    animation:

        buttonAppear
        1s
        10s
        forwards;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes stemGrow {

    0% {
        height: 0;
    }

    100% {
        height: 360px;
    }
}


@keyframes leafGrow {

    0% {

        opacity: 0;

        transform:
            scale(0);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


@keyframes flowerBloom {

    0% {

        opacity: 0;

        transform:
            scale(0)
            translateY(30px);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.2)
            translateY(-5px);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


@keyframes grassGrow {

    0% {
        height: 0;
    }

    100% {
        height: 100px;
    }
}


@keyframes starTwinkle {

    0% {

        opacity: 0;

        transform:
            scale(.3);
    }

    50% {

        opacity: 1;

        transform:
            scale(1.5);
    }

    100% {

        opacity: 0;

        transform:
            scale(.3);
    }
}


@keyframes textGlow {

    0% {

        opacity: 0;

        transform:
            translateY(20px);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes centerText {

    0% {

        opacity: 0;

        transform:
            translateY(-20px);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes textParticle {

    0% {

        opacity: 0;

        transform:
            translate(
                0,
                20px
            )
            scale(.3);
    }

    30% {
        opacity: 1;
    }

    100% {

        opacity: 0;

        transform:
            translate(
                0,
                -80px
            )
            scale(1.5);
    }
}


@keyframes buttonAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .garden {

        transform:
            translateX(-50%)
            scale(.72);

        transform-origin:
            bottom center;
    }


    .love-text {

        width: 145px;

        font-size: 13px;
    }


    .left-text {

        left: -20px;

        top: 300px;
    }


    .right-text {

        right: -20px;

        top: 300px;
    }


    .center-text {

        font-size: 18px;

        letter-spacing: 2px;

        top: 45px;
    }


    .start-title {

        font-size: 22px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="music"
    loop
    preload="auto">

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div
    class="start-screen"
    id="startScreen">

    <div class="start-title">

        A little flower for Deannia ❀

    </div>


    <button
        class="start-button"
        id="startButton">

        Open My Flower ✿

    </button>

</div>


<!-- =====================================================
     MAIN SCENE
===================================================== -->

<div class="scene">


    <div
        class="stars"
        id="stars">
    </div>


    <div class="ground-glow">
    </div>


    <div class="center-text">

        For you, my Joy ♡

    </div>


    <div
        class="text-particles"
        id="textParticles">
    </div>


    <div class="garden">


        <!-- STEMS -->

        <div class="stem center"></div>

        <div class="stem left1"></div>

        <div class="stem left2"></div>

        <div class="stem right1"></div>

        <div class="stem right2"></div>


        <!-- LEAVES -->

        <div class="leaf l1"></div>

        <div class="leaf l2"></div>

        <div class="leaf l3"></div>

        <div class="leaf l4"></div>


        <!-- LEFT MESSAGE -->

        <div class="love-text left-text">

            Thank you for<br>

            staying with<br>

            me ♡

        </div>


        <!-- RIGHT MESSAGE -->

        <div class="love-text right-text">

            You mean the <br>

            world to me<br>

            ✿

        </div>


        <!-- FLOWER 1 -->

        <div class="flower f1">

            <div class="petal p1"></div>

            <div class="petal p2"></div>

            <div class="petal p3"></div>

            <div class="petal p4"></div>

            <div class="petal p5"></div>

            <div class="flower-center"></div>

        </div>


        <!-- FLOWER 2 -->

        <div class="flower f2">

            <div class="petal p1"></div>

            <div class="petal p2"></div>

            <div class="petal p3"></div>

            <div class="petal p4"></div>

            <div class="petal p5"></div>

            <div class="flower-center"></div>

        </div>


        <!-- FLOWER 3 -->

        <div class="flower f3">

            <div class="petal p1"></div>

            <div class="petal p2"></div>

            <div class="petal p3"></div>

            <div class="petal p4"></div>

            <div class="petal p5"></div>

            <div class="flower-center"></div>

        </div>


        <!-- FLOWER 4 -->

        <div class="flower f4">

            <div class="petal p1"></div>

            <div class="petal p2"></div>

            <div class="petal p3"></div>

            <div class="petal p4"></div>

            <div class="petal p5"></div>

            <div class="flower-center"></div>

        </div>


        <!-- FLOWER 5 -->

        <div class="flower f5">

            <div class="petal p1"></div>

            <div class="petal p2"></div>

            <div class="petal p3"></div>

            <div class="petal p4"></div>

            <div class="petal p5"></div>

            <div class="flower-center"></div>

        </div>


        <div
            class="grass"
            id="grass">
        </div>


    </div>


    <div class="ground">
    </div>


</div>


<!-- MUSIC CONTROL -->

<button
    class="music-button"
    id="musicButton">

    🔊

</button>


<script>

/* =====================================================
   CREATE STARS
===================================================== */

const stars =
    document.getElementById(
        "stars"
    );


for (
    let i = 0;
    i < 120;
    i++
) {

    const star =
        document.createElement(
            "div"
        );

    star.className =
        "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 80 + "%";

    star.style.animationDelay =
        Math.random() * 5 + "s";

    star.style.animationDuration =
        2 +
        Math.random() * 4 +
        "s";

    stars.appendChild(
        star
    );
}


/* =====================================================
   CREATE GRASS
===================================================== */

const grass =
    document.getElementById(
        "grass"
    );


for (
    let i = 0;
    i < 80;
    i++
) {

    const blade =
        document.createElement(
            "div"
        );

    blade.className =
        "blade";

    blade.style.left =
        Math.random() * 100 +
        "%";

    blade.style.transform =
        "rotate(" +
        (
            -25 +
            Math.random() * 50
        ) +
        "deg)";

    blade.style.animationDelay =
        Math.random() * 4 +
        "s";

    grass.appendChild(
        blade
    );
}


/* =====================================================
   CREATE PARTICLES
===================================================== */

const textParticles =
    document.getElementById(
        "textParticles"
    );


for (
    let i = 0;
    i < 55;
    i++
) {

    const particle =
        document.createElement(
            "div"
        );

    particle.className =
        "text-particle";

    particle.style.left =
        (
            5 +
            Math.random() * 90
        ) +
        "%";

    particle.style.top =
        (
            30 +
            Math.random() * 55
        ) +
        "%";

    particle.style.animationDelay =
        Math.random() * 5 +
        "s";

    particle.style.animationDuration =
        2 +
        Math.random() * 3 +
        "s";

    textParticles.appendChild(
        particle
    );
}


/* =====================================================
   MUSIC
===================================================== */

const music =
    document.getElementById(
        "music"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const musicButton =
    document.getElementById(
        "musicButton"
    );


/* =====================================================
   OPEN FLOWER BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    async function () {

        /*
         * The click is a real user interaction,
         * so the browser allows the music to play.
         */

        music.volume = 0.7;

        try {

            await music.play();

            musicButton.textContent =
                "🔊";

        }

        catch (error) {

            console.log(
                "Music could not start:",
                error
            );

            musicButton.textContent =
                "🔇";

        }


        /*
         * Hide the opening screen.
         */

        startScreen.classList.add(
            "hide"
        );

    }
);


/* =====================================================
   MUSIC BUTTON
===================================================== */

musicButton.addEventListener(
    "click",
    async function () {

        if (
            music.paused
        ) {

            try {

                await music.play();

                musicButton.textContent =
                    "🔊";

            }

            catch (error) {

                console.log(
                    error
                );

            }

        }

        else {

            music.pause();

            musicButton.textContent =
                "🔇";

        }

    }
);

</script>

</body>

</html>
